<div class="mat-elevation-z8">
  <!-- 1. 表格本體 -->
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- ID 欄位 (放在表格內) -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let e">{{ e.id }}</td>
    </ng-container>

    <!-- 姓名欄位 -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>姓名</th>
      <td mat-cell *matCellDef="let e">{{ e.name }}</td>
    </ng-container>

    <!-- 部門欄位 (注意：這裡要用 e.department，不是 e.depart，因為你在 TS 寫的是 department) -->
    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef>部門</th>
      <td mat-cell *matCellDef="let e">{{ e.department }}</td>
    </ng-container>

    <!-- 到職日欄位 -->
    <ng-container matColumnDef="hireDate">
      <th mat-header-cell *matHeaderCellDef>到職日</th>
      <!-- 注意這裡的 date 格式：yyyy/MM/dd (大寫 MM 代表月份) -->
      <td mat-cell *matCellDef="let e">
        {{ e.hireDate | date: "yyyy/MM/dd" }}
      </td>
    </ng-container>

    <!-- 薪水欄位 -->
    <ng-container matColumnDef="salary">
      <th mat-header-cell *matHeaderCellDef>薪資</th>
      <td
        mat-cell
        *matCellDef="let e"
        [ngClass]="{ 'salary-high': e.salary >= 60000 }"
      >
        {{ e.salary }}
      </td>
    </ng-container>

    <!-- 2. 標題列定義 (必須放在表格內，在所有欄位定義之後) -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- 3. 資料列定義 (必須放在表格內) -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
  </mat-paginator>
</div>
